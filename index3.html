<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Window</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="modal">
       <div class="modal__window">
           <p class="head__modal">ВХОД</p>
           <form class="modal__window_form" method="post">
               <input class="header__search-txt-1" type="text" name="userEmail" placeholder="Логин">
               
               <input class="header__search-txt-2" type="text" name="userPassword" placeholder="Пароль">
               <div class="remember__f">
                <div id="dialog_p">
                   <input type="checkbox" id="check1">
                   <label for="check1" class="custom-checkbox">
                   <span class="checkmark">
                    &#10004;
                   </span> 
                 </label>
                   <label for="check1"><span>Запомнить</span></label>
                </div>
               
               </div>
               <button class="vhod__modal" type="submit">Вход</button>
            </form>
        </div> 
     </div>     
     
</body>
</html>
